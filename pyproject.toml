[project]
name = "vantage-frc"
version = "0.1.0"
description = "AI Tactical Intelligence and Copilot System for FRC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "tenacity>=8.2.0",
    "orjson>=3.10.0",
    "redis>=5.0.0",
    "apscheduler>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "C4", "W", "PL", "RUF", "PERF", "SIM", "TIDY", "ARG"]
ignore = ["SIM102", "SIM103", "SIM117", "ARG001", "ARG002"]
fixable = ["F", "I", "UP", "B", "C4", "W", "PL", "RUF", "PERF", "SIM", "TIDY", "ARG"]
unfixable = ["E"]
exclude = [".git", ".venv", "dist", "build", "*.egg-info"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true
exclude = ["tests/", "scripts/", "alembic/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"